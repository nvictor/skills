<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Hues chord gradients</title>
  <desc>Three upright tiles blend the pitches of A minor, F major, and C major.</desc>
  <defs>
    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444c60"/>
      <stop offset="100%" stop-color="#1d202b"/>
    </linearGradient>
    <linearGradient id="am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8430df"/>
      <stop offset="50%" stop-color="#24d94d"/>
      <stop offset="100%" stop-color="#ff6500"/>
    </linearGradient>
    <linearGradient id="f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24d94d"/>
      <stop offset="50%" stop-color="#ff6500"/>
      <stop offset="100%" stop-color="#a12af0"/>
    </linearGradient>
    <linearGradient id="c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e10012"/>
      <stop offset="50%" stop-color="#8430df"/>
      <stop offset="100%" stop-color="#24d94d"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <rect x="27" y="33" width="458" height="458" rx="105" fill="#10121b"/>
  <rect x="27" y="22" width="458" height="458" rx="105" fill="url(#shell)" stroke="#61697d" stroke-width="2"/>
  <rect x="27" y="22" width="458" height="458" rx="105" fill="url(#sheen)"/>
  <rect x="39" y="34" width="434" height="434" rx="94" fill="none" stroke="#c1c9df" stroke-opacity=".14" stroke-width="2"/>
  <rect x="82" y="108" width="108" height="304" rx="33" fill="#151522"/>
  <rect x="82" y="100" width="108" height="304" rx="33" fill="url(#am)"/>
  <rect x="82" y="100" width="108" height="304" rx="33" fill="url(#shade)" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
  <rect x="97" y="112" width="78" height="6" rx="3" fill="#fff" opacity="0.52"/>
  <rect x="202" y="108" width="108" height="304" rx="33" fill="#151522"/>
  <rect x="202" y="100" width="108" height="304" rx="33" fill="url(#f)"/>
  <rect x="202" y="100" width="108" height="304" rx="33" fill="url(#shade)" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
  <rect x="217" y="112" width="78" height="6" rx="3" fill="#fff" opacity="0.52"/>
  <rect x="322" y="108" width="108" height="304" rx="33" fill="#151522"/>
  <rect x="322" y="100" width="108" height="304" rx="33" fill="url(#c)"/>
  <rect x="322" y="100" width="108" height="304" rx="33" fill="url(#shade)" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
  <rect x="337" y="112" width="78" height="6" rx="3" fill="#fff" opacity="0.52"/>
</svg>
