<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Hues chord gradients</title>
  <desc>A dark shell holding three tall tiles, each a bottom-to-top gradient through the pitch colors of one chord (Am, F, C). Depth uses vector geometry and gradients without filter dependencies.</desc>
  <defs><linearGradient id="shell" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#454B5A"/><stop offset="1" stop-color="#161920"/></linearGradient><linearGradient id="am" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff6500"/><stop offset="0.5" stop-color="#24d94d"/><stop offset="1" stop-color="#8430df"/></linearGradient><linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#a12af0"/><stop offset="0.5" stop-color="#ff6500"/><stop offset="1" stop-color="#24d94d"/></linearGradient><linearGradient id="c" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#24d94d"/><stop offset="0.5" stop-color="#8430df"/><stop offset="1" stop-color="#e10012"/></linearGradient></defs>
  <rect x="24" y="30" width="464" height="464" rx="104" fill="#0C0E13"/><rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shell)"/>
  <rect x="76" y="114" width="108" height="300" rx="34" fill="#000" opacity="0.45"/><rect x="76" y="106" width="108" height="300" rx="34" fill="url(#am)"/><rect x="92" y="118" width="76" height="12" rx="6" fill="#fff" opacity="0.4"/><rect x="202" y="114" width="108" height="300" rx="34" fill="#000" opacity="0.45"/><rect x="202" y="106" width="108" height="300" rx="34" fill="url(#f)"/><rect x="218" y="118" width="76" height="12" rx="6" fill="#fff" opacity="0.4"/><rect x="328" y="114" width="108" height="300" rx="34" fill="#000" opacity="0.45"/><rect x="328" y="106" width="108" height="300" rx="34" fill="url(#c)"/><rect x="344" y="118" width="76" height="12" rx="6" fill="#fff" opacity="0.4"/>
</svg>
