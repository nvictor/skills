<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Mermaido tail and waves</title>
  <desc>An asymmetric seafoam mermaid tail curling up from teal waves. Depth uses vector geometry and gradients without filter dependencies.</desc>
  <defs><linearGradient id="sea" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#178E9D"/><stop offset="1" stop-color="#064B67"/></linearGradient><linearGradient id="tail" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#E0FFF0"/><stop offset="1" stop-color="#55DCC5"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#49D8CB"/><stop offset="1" stop-color="#169DAA"/></linearGradient><clipPath id="shellClip"><rect x="24" y="24" width="464" height="464" rx="104" fill="white"/></clipPath></defs>
  <rect x="24" y="30" width="464" height="464" rx="104" fill="#06495B"/><rect x="24" y="24" width="464" height="464" rx="104" fill="url(#sea)"/>
  <g clip-path="url(#shellClip)">
