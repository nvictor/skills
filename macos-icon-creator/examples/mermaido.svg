    <path d="M256 218 C221 146 146 103 82 113 C99 192 159 246 216 265 C251 300 245 350 188 440 L253 449 C313 360 303 297 285 265 C356 248 414 190 431 113 C354 102 285 149 256 218 Z" fill="#063D55" transform="translate(5 9)"/>
    <path d="M256 218 C221 146 146 103 82 113 C99 192 159 246 216 265 C251 300 245 350 188 440 L253 449 C313 360 303 297 285 265 C356 248 414 190 431 113 C354 102 285 149 256 218 Z" fill="url(#tail)"/>
    <path d="M256 218 C285 149 354 102 431 113 C414 190 356 248 285 265 C303 297 313 360 253 449 L222 445 C291 341 267 280 256 218 Z" fill="#3DBCAA" opacity="0.65"/>
    <path d="M24 378 Q104 340 187 374 T354 375 Q434 334 488 352 V488 H24 Z" fill="url(#wave)"/>
  </g>

</svg>
