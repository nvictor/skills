<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Grooves pad grid</title>
  <desc>A dark shell holding four large drum pads, one lit orange. Depth uses vector geometry and gradients without filter dependencies.</desc>
  <defs><linearGradient id="shell" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#454B5A"/><stop offset="1" stop-color="#161920"/></linearGradient><linearGradient id="off" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#323847"/><stop offset="1" stop-color="#232733"/></linearGradient><linearGradient id="on" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFB45A"/><stop offset="1" stop-color="#FF7A1A"/></linearGradient></defs>
  <rect x="24" y="30" width="464" height="464" rx="104" fill="#0C0E13"/><rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shell)"/>
  <rect x="96" y="106" width="152" height="152" rx="38" fill="#B84A0A"/><rect x="96" y="96" width="152" height="152" rx="38" fill="url(#on)"/><rect x="112" y="104" width="120" height="16" rx="8" fill="#FFD9A8" opacity="0.55"/><rect x="264" y="104" width="152" height="152" rx="38" fill="#0B0D12"/><rect x="264" y="96" width="152" height="152" rx="38" fill="url(#off)"/><rect x="96" y="272" width="152" height="152" rx="38" fill="#0B0D12"/><rect x="96" y="264" width="152" height="152" rx="38" fill="url(#off)"/><rect x="264" y="272" width="152" height="152" rx="38" fill="#0B0D12"/><rect x="264" y="264" width="152" height="152" rx="38" fill="url(#off)"/>
</svg>
