<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>GrandReveal presentation player</title>
  <desc>A dimensional play key beneath a red angled presentation-board header. Depth uses vector geometry and gradients without filter dependencies.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#34488B"/><stop offset="1" stop-color="#101A40"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#FF7776"/><stop offset="1" stop-color="#C82C50"/></linearGradient><linearGradient id="play" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE9FF"/></linearGradient><clipPath id="shellClip"><rect x="24" y="24" width="464" height="464" rx="104" fill="white"/></clipPath></defs>
  <rect x="24" y="30" width="464" height="464" rx="104" fill="#101832"/><rect x="24" y="24" width="464" height="464" rx="104" fill="url(#blue)"/>
  <g clip-path="url(#shellClip)">
