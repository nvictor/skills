<rect width="1428" height="520" fill="#EAE0C4"/>
<text x="714.0" y="56" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#25231F">Agentic Commerce Experience</text>
<text x="714.0" y="80" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#756F64">AI agents acting as autonomous proxies for multi-step shopping and fulfillment</text>
<rect x="42.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#F6EDD6" stroke="#D4C9AE" filter="url(#panelShadow)"/>
<text x="202.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#25231F">User Intent &amp; Delegation</text>
<text x="202.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">High-level goal setting by the user</text>
<text x="202.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">The user provides broad constraints</text>
<text x="202.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">(e.g., 'Find me trail shoes under</text>
<text x="202.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">$150 by Friday').</text>
<rect x="382.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#F6EDD6" stroke="#D4C9AE" filter="url(#panelShadow)"/>
<text x="542.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#25231F">Autonomous Agent Core</text>
<text x="542.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">Reasoning, planning, and evaluation</text>
<text x="542.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">loop</text>
<text x="542.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">Agent breaks down the goal into</text>
<text x="542.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">executable search and comparison</text>
<text x="542.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">tasks.</text>
<rect x="722.0" y="126.0" width="322.0" height="360.0" rx="18" fill="#F6EDD6" stroke="#D4C9AE" filter="url(#panelShadow)"/>
<text x="883.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#25231F">Marketplace Interaction</text>
<text x="883.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">Sourcing and negotiating with external</text>
<text x="883.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">vendors</text>
<text x="883.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">Agent queries multiple sources in</text>
<text x="883.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">parallel to find the best match.</text>
<rect x="1064.0" y="126.0" width="322.0" height="360.0" rx="18" fill="#F6EDD6" stroke="#D4C9AE" filter="url(#panelShadow)"/>
<text x="1225.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#25231F">Execution &amp; Monitoring</text>
<text x="1225.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">Transaction completion and fulfillment</text>
<text x="1225.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#25231F">tracking</text>
<text x="1225.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">Agent handles the final purchase and</text>
<text x="1225.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#756F64">keeps the user updated on shipping.</text>
