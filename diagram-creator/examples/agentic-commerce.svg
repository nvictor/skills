<svg xmlns="http://www.w3.org/2000/svg" width="1428" height="520" viewBox="0 0 1428 520" role="img" aria-label="Agentic Commerce Experience">
<defs>
<filter id="panelShadow" x="-10%" y="-10%" width="120%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.05)"/>
</filter>
<marker id="arrow-studio-paper" viewBox="0 0 11 12" markerWidth="11" markerHeight="12" refX="9.5" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
<path d="M 1.5 1.0 L 9.5 6 L 1.5 11.0" fill="none" stroke="#8A8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
