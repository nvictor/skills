<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="520" viewBox="0 0 1424 520" role="img" aria-label="MCP, Tools, Skills &amp; Agents">
<defs>
<filter id="panelShadow" x="-10%" y="-10%" width="120%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.05)"/>
</filter>
<marker id="arrow-graphite-citrus" viewBox="0 0 11 12" markerWidth="11" markerHeight="12" refX="9.5" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
<path d="M 1.5 1.0 L 9.5 6 L 1.5 11.0" fill="none" stroke="#777B80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1424" height="520" fill="#E5E4DF"/>
<text x="712.0" y="56" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#202124">MCP, Tools, Skills &amp; Agents</text>
<text x="712.0" y="80" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#666A70">Agents choose skills; skills call tools; tools are exposed through MCP</text>
<rect x="42.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#EEECEA" stroke="#D0CECA" filter="url(#panelShadow)"/>
<text x="202.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#202124">Agent</text>
<text x="202.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">Orchestrates goals and decisions</text>
<text x="202.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">The agent interprets the goal and</text>
<text x="202.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">decides which capability path to use.</text>
<rect x="382.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#EEECEA" stroke="#D0CECA" filter="url(#panelShadow)"/>
<text x="542.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#202124">Skills</text>
<text x="542.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">Reusable ways of using tools</text>
<text x="542.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">A skill packages reusable procedure,</text>
<text x="542.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">domain guidance, and tool-use</text>
<text x="542.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">strategy.</text>
<rect x="722.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#EEECEA" stroke="#D0CECA" filter="url(#panelShadow)"/>
<text x="882.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#202124">Tools</text>
<text x="882.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">Capabilities exposed via standard</text>
<text x="882.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">interface</text>
<text x="882.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">Tools are named callable</text>
<text x="882.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">capabilities, such as search, file</text>
<text x="882.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">edits, rendering, or app control.</text>
<rect x="1062.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#EEECEA" stroke="#D0CECA" filter="url(#panelShadow)"/>
<text x="1222.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#202124">MCP</text>
<text x="1222.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">Communication, tool interface,</text>
<text x="1222.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">context delivery</text>
<text x="1222.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">MCP standardizes how external context</text>
<text x="1222.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">and tools are exposed to the agent</text>
<text x="1222.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#666A70">runtime.</text>
<rect x="143.0" y="194.0" width="118.0" height="46.0" rx="8" fill="#F9F8F5" stroke="#D0CECA" stroke-width="1.2"/>
<text x="202.0" y="221.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">Goal</text>
<rect x="143.0" y="258.0" width="118.0" height="46.0" rx="8" fill="#F5E9A9" stroke="#C6A100" stroke-width="2"/>
<text x="202.0" y="285.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">Agent</text>
<rect x="474.5" y="258.0" width="135.0" height="46.0" rx="8" fill="#F5E9A9" stroke="#C6A100" stroke-width="2"/>
<text x="542.0" y="285.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">Skill procedure</text>
<rect x="823.0" y="258.0" width="118.0" height="46.0" rx="8" fill="#F9F8F5" stroke="#D0CECA" stroke-width="1.2"/>
<text x="882.0" y="285.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">Tool A</text>
<rect x="1163.0" y="258.0" width="118.0" height="46.0" rx="8" fill="#F5E9A9" stroke="#C6A100" stroke-width="2"/>
<text x="1222.0" y="285.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">MCP</text>
<rect x="823.0" y="322.0" width="118.0" height="46.0" rx="8" fill="#F9F8F5" stroke="#D0CECA" stroke-width="1.2"/>
<text x="882.0" y="349.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#202124">Tool B</text>
