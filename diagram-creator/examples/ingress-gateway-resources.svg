<rect width="750" height="520" fill="#DCE5F0"/>
<text x="375.0" y="56" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#17202A">Ingress vs Gateway API Resources</text>
<text x="375.0" y="80" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" fill="#637083">Comparing the monolithic ingress model with the modular Gateway API resource stack</text>
<rect x="42.0" y="126.0" width="320.0" height="360.0" rx="18" fill="#E9EFF7" stroke="#C5D2E2" filter="url(#panelShadow)"/>
<text x="202.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#17202A">Ingress</text>
<text x="202.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17202A">Single resource fronting controller-</text>
<text x="202.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17202A">specific behavior</text>
<text x="202.0" y="446.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#637083">Routing rules, TLS, and controller</text>
<text x="202.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#637083">behavior are coupled to one front-</text>
<text x="202.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#637083">door object.</text>
<rect x="382.0" y="126.0" width="326.0" height="360.0" rx="18" fill="#E9EFF7" stroke="#C5D2E2" filter="url(#panelShadow)"/>
<text x="545.0" y="160.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" fill="#17202A">Gateway API</text>
<text x="545.0" y="180.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17202A">Split roles for infrastructure,</text>
<text x="545.0" y="194.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17202A">entrypoints, and routes</text>
<text x="545.0" y="460.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#637083">Gateway API separates platform</text>
<text x="545.0" y="474.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" fill="#637083">ownership from app routing intent.</text>
<rect x="160.0" y="226.0" width="142.0" height="46.0" rx="8" fill="#E4EDFF" stroke="#2563EB" stroke-width="2"/>
<text x="231.0" y="253.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">Ingress resource</text>
<rect x="406.0" y="226.0" width="118.0" height="46.0" rx="8" fill="#F5F8FC" stroke="#C5D2E2" stroke-width="1.2"/>
<text x="465.0" y="253.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">GatewayClass</text>
<rect x="153.0" y="290.0" width="156.0" height="46.0" rx="8" fill="#F5F8FC" stroke="#C5D2E2" stroke-width="1.2"/>
<text x="231.0" y="317.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">Ingress controller</text>
<rect x="406.0" y="290.0" width="118.0" height="46.0" rx="8" fill="#E4EDFF" stroke="#2563EB" stroke-width="2"/>
<text x="465.0" y="317.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">Gateway</text>
<rect x="566.0" y="290.0" width="118.0" height="46.0" rx="8" fill="#F5F8FC" stroke="#C5D2E2" stroke-width="1.2"/>
<text x="625.0" y="317.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">HTTPRoute</text>
<rect x="163.5" y="354.0" width="135.0" height="46.0" rx="8" fill="#F5F8FC" stroke="#C5D2E2" stroke-width="1.2"/>
<text x="231.0" y="381.0" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">Backend service</text>
<rect x="566.0" y="354.0" width="118.0" height="46.0" rx="8" fill="#F5F8FC" stroke="#C5D2E2" stroke-width="1.2"/>
<text x="625.0" y="373.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">BackendRef /</text>
<text x="625.0" y="388.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#17202A">Service</text>
